name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install JS & Playwright dependencies
        run: |
          npm ci
          npx playwright install chromium
      - name: Shell syntax & environment check
        run: |
          chmod +x bin/slopguard bin/gemini-uiux scripts/*.sh scripts/*.py install.sh uninstall.sh
          bash -n bin/slopguard bin/gemini-uiux scripts/*.sh install.sh uninstall.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck bin/slopguard bin/gemini-uiux scripts/*.sh install.sh uninstall.sh
          fi
          bash scripts/doctor.sh
          bash bin/slopguard version
      - name: Run full verification suite (TS, System Audit, AST Static Audit, Golden Eval, Unit, Playwright/Axe E2E)
        run: npm test
